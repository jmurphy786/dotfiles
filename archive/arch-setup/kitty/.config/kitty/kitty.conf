# ==========================================
# Kitty Config - Pure Built-in Workspace System
# ==========================================
# Tabs in kitty = Workspaces (named via set_tab_title)
# Windows in kitty = Panes (split via launch --location)
# Leader key: CTRL+Space (modal timeout mode)

# ==========================================
# Performance
# ==========================================
repaint_delay    8
input_delay      1
sync_to_monitor  yes

# ==========================================
# Font
# ==========================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# ==========================================
# Window
# ==========================================
enabled_layouts splits
initial_layout splits
linux_display_server wayland
clipboard_control write-clipboard write-primary read-clipboard read-primary
background_opacity 1.0
window_padding_width 0
window_border_width 1
confirm_os_window_close 0

# ==========================================
# Cursor
# ==========================================
cursor_blink_interval 0
cursor_shape block
cursor_trail 0

# ==========================================
# Terminal Bell
# ==========================================
enable_audio_bell no
visual_bell_duration 0.0

# ==========================================
# Colors (Catppuccin Macchiato)
# ==========================================
foreground            #cad3f5
background            #24273a
cursor                #f4dbd6
cursor_text_color     #24273a
selection_foreground  #24273a
selection_background  #f4dbd6
url_color             #f4dbd6

# Window borders
active_border_color   #D08B57
inactive_border_color #A0785A
bell_border_color     #eed49f

# Tab bar
active_tab_foreground   #181926
active_tab_background   #c6a0f6
inactive_tab_foreground #cad3f5
inactive_tab_background #1e2030
tab_bar_background      #181926
tab_bar_edge            bottom
tab_bar_style           custom
tab_bar_min_tabs        1
tab_title_max_length    20

# 16 terminal colors
# black
color0  #494d64
color8  #5b6078
# red
color1  #ed8796
color9  #ed8796
# green
color2  #a6da95
color10 #a6da95
# yellow
color3  #eed49f
color11 #eed49f
# blue
color4  #8aadf4
color12 #8aadf4
# magenta
color5  #f5bde6
color13 #f5bde6
# cyan
color6  #8bd5ca
color14 #8bd5ca
# white
color7  #b8c0e0
color15 #a5adcb

# ==========================================
# Tab Bar Styling
# ==========================================
tab_title_template "{custom}"
tab_activity_symbol none

# ==========================================
# Multi-key / Modal Timeout
# ==========================================
map_timeout 2.0

# ==========================================
# Key Mappings
# ==========================================

# --- Leader Mode ---
map --new-mode leader ctrl+space no_op

# --- Tab Management (Tabs = Workspaces) ---
map --mode leader c     new_tab
map --mode leader x     close_window
map ctrl+w              close_tab
map ctrl+t              new_tab
map --mode leader 1     goto_tab 1
map --mode leader 2     goto_tab 2
map --mode leader 3     goto_tab 3
map --mode leader 4     goto_tab 4
map --mode leader 5     goto_tab 5
map --mode leader 6     goto_tab 6
map --mode leader 7     goto_tab 7
map --mode leader 8     goto_tab 8
map --mode leader 9     goto_tab 9

# --- Pane Splitting ---
map --mode leader s     launch --location=vsplit
map --mode leader v     launch --location=hsplit

# --- Pane Navigation ---
map --mode leader h     neighboring_window left
map --mode leader j     neighboring_window down
map --mode leader k     neighboring_window up
map --mode leader l     neighboring_window right

# --- Workspace Switching ---
map --mode leader b     previous_tab
map --mode leader a     select_tab
map ctrl+slash           select_tab

# --- Workspace Management (Pure Built-in) ---
map --mode leader w     combine : pop_keyboard_mode : new_tab : set_tab_title
map --mode leader r     combine : pop_keyboard_mode : set_tab_title
map --mode leader R     combine : pop_keyboard_mode : set_tab_title
map --mode leader escape pop_keyboard_mode
map --mode leader d     close_tab

# --- Popover Overlays ---
map --mode leader n     launch --type=background kitty --class=notes --title=Notes --directory=/home/jordan/personal/notes nvim main.md
map --mode leader m     launch --type=overlay --cwd ~/work-notes nvim main.md

# --- Resize Mode ---
map --mode leader --new-mode resize --timeout 2.0 left resize_window narrower
map --mode resize left     resize_window narrower
map --mode resize right    resize_window wider
map --mode resize up       resize_window taller
map --mode resize down     resize_window shorter
map --mode resize escape   pop_keyboard_mode
map --mode resize return   pop_keyboard_mode

# --- Unmap conflicting defaults ---
map kitty_mod+enter
map kitty_mod+t
map kitty_mod+w
map kitty_mod+left
map kitty_mod+right
map kitty_mod+up
map kitty_mod+down
