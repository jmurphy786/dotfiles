onboarding = false

# Host (client) half of the herdr setup. The client applies [theme], [ui] and
# [keys] to every machine it shows, so the keybindings live here. Each
# devcontainer runs a herdr server with its own config.toml from
# devpod-brew-dotfiles, which covers [worktrees], [session] and
# [experimental] for panes running there and holds the jm.portals-bootstrap
# plugin that the plugin_action keys below resolve to -- so those keys run
# inside whichever container's workspace is selected.
[theme]
name = "rose-pine"
auto_switch = false

[keys]
prefix = "ctrl+b"

focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

split_vertical = "prefix+%"
split_horizontal = "prefix+,"

new_tab = "prefix+c"

toggle_sidebar = "prefix+p"

# Built-in worktree handling, bound. workspace_picker (prefix+w) and
# close_workspace (prefix+shift+d) keep their defaults. remove_worktree only
# deletes the checkout -- the branch stays, like `workmux remove -k`.
open_worktree = "prefix+g"
remove_worktree = "prefix+d"

# The built-in dialog puts checkouts under worktrees.directory, outside the
# bind-mounted repo, where a rebuild loses them and workmux cannot see them.
# prefix+shift+g below replaces it.
new_worktree = ""

# Worktree from a local branch, a remote-only branch, an open PR, or a typed
# new name, checked out under <repo>/.worktrees/<slug> like workmux does.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "jm.portals-bootstrap.wt-add-open"
description = "worktree: new from branch / remote / PR"

# The prefix+S gh-stack menu, ported off the tmux display-menu.
[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jm.portals-bootstrap.gh-stack-open"
description = "gh stack"

# The popups below are host scripts: run them with Local selected, since a
# command runs on the selected server and the containers have no devpod.

# Add a DevPod container as a machine, with its repo as a workspace.
[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = '"$HOME/.config/herdr/scripts/devpod-add.sh"'
description = "devpod: add container"

# Rename, disable/enable or remove a saved machine. herdr has no built-in
# binding for this.
[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = '"$HOME/.config/herdr/scripts/devpod-manage.sh"'
description = "devpod: manage machines"

# After a laptop boot: start each machine's container and its herdr server.
[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = '"$HOME/.config/herdr/scripts/herdr-up.sh"'
description = "devpod: bring machines back up"

# Spaces sidebar. Worktrees stay grouped under their repo's row; $jm_mark
# flags them as its branches, and $jm_stack is the gh-stack layer index --
# both published by jm.portals-bootstrap on the server, styled here. $jm_ports
# (":5173 :3000", listening dev servers) leads the second row: the sidebar is
# narrow and a long branch name would push it off the end.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$jm_mark", fg = "#89b4fa" }, "workspace"],
  [{ token = "$jm_ports", fg = "#f9e2af", bold = true }, "branch", "git_status", { token = "$jm_stack", fg = "#89b4fa" }],
]

# The host is a server too, for its Local workspaces: bring their claude
# sessions and scrollback back after a restart, as in the containers.
[session]
resume_agents_on_restore = true

[experimental]
pane_history = true
