onboarding = false

# Host (client) half of the herdr setup. The client applies [theme], [ui] and
# [keys] to every machine it shows, so the keybindings live here. Each
# devcontainer runs a herdr server with its own config.toml from
# devpod-brew-dotfiles, which covers [worktrees], [session] and [experimental]
# for panes running there. It also holds the jm.portals-bootstrap plugin AND
# the [[keys.command]] plugin_action keys that run it (prefix+w worktree menu,
# prefix+shift+s gh stack): custom commands are server-side config, and the
# client does not forward a keys.command it doesn't have itself, so they cannot
# live here.
[theme]
name = "solarized"
auto_switch = false

# herdr.dev hero look: Catppuccin Mocha with a mauve accent instead of blue
[theme.custom]
accent = "#cba6f7"

[keys]
prefix = "ctrl+b"

# Pane focus is on alt+h/j/k/l. ctrl+h/j/k/l are plugin_action keys (see the
# [[keys.command]] entries below) that pass the key to nvim when it is in the
# foreground; a built-in on them would swallow the key before nvim sees it.
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

split_vertical = "prefix+%"
split_horizontal = "prefix+,"

new_tab = "prefix+c"

toggle_sidebar = "prefix+p"

# Worktrees. herdr's built-in New/Open worktree only run from the parent repo
# and error from a linked worktree, so prefix+w is the plugin's worktree menu
# instead, bound in each container's server config (see above). remove_worktree
# acts on the selected child itself, so the built-in is fine and keeps
# prefix+d; it only deletes the checkout, the branch stays.
remove_worktree = "prefix+d"

# A built-in wins a key clash and the keys.command on it is disabled, so the
# defaults on prefix+g (goto) and prefix+shift+g (new_worktree) are moved.
# goto -- the client's agent/terminal picker, the one that can switch machines --
# takes prefix+shift+g; new_worktree is parked on a chord nothing uses. The
# containers set the same two in their own config. open_worktree is unset by
# default and stays that way.
goto = "prefix+shift+g"
new_worktree = "prefix+alt+g"

# Switching machines is client state that no plugin, popup or CLI call can move
# (`herdr --machine X workspace focus` changes the server's focus, not the
# client's view). The built-in workspace navigator already spans every
# connected machine, so use that. It moves from prefix+w to prefix+h
# (nvim-style; focus_pane_left is on ctrl+h above) so the worktree menu can
# take prefix+w. The containers set the same.
workspace_picker = "prefix+h"

# Navigate mode (prefix+h): j/k move the workspace selection, vim-style.
# j/k were pane focus here by default, so that moves to ctrl+j/k, matching
# ctrl+h/j/k/l pane focus outside navigate mode. h/l stay pane left/right.
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"

# Workspace cycling without entering navigate mode, down/up like the sidebar.
# Worktrees are workspaces too, so they are part of the cycle.
next_workspace = "ctrl+shift+j"
previous_workspace = "ctrl+shift+k"

# nvim-aware pane focus for Local workspaces (the containers bind the same in
# their own config). Needs the plugin installed on the host:
#   herdr plugin install kaar/nvim-herdr-navigator
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-navigator.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-navigator.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-navigator.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-navigator.right"
description = "navigate right (nvim/herdr)"

# The chords above shadow ctrl+l (clear screen) in shells; this puts it back.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "send ctrl+l (clear screen) to pane"

# lazygit and tuicr popups, in the focused pane's directory. These cover Local
# workspaces; each container's config has the same two for its own.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "tuicr"
description = "tuicr review"
width = "90%"
height = "90%"

# The popups below are host scripts: run them with Local selected, since a
# command runs on the selected server and the containers have no devpod.

# Add a DevPod container as a machine, with its repo as a workspace.
[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = '"$HOME/.config/herdr/scripts/devpod-add.sh"'
description = "devpod: add container"

# Rename, disable/enable or remove a saved machine. herdr has no built-in
# binding for this.
[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = '"$HOME/.config/herdr/scripts/devpod-manage.sh"'
description = "devpod: manage machines"

# After a laptop boot: start each machine's container and its herdr server.
[[keys.command]]
key = "prefix+shift+u"
type = "popup"
command = '"$HOME/.config/herdr/scripts/herdr-up.sh"'
description = "devpod: bring machines back up"

# Spaces sidebar. Worktrees stay grouped under their repo's row; $jm_mark
# flags them as its branches, and $jm_stack is the gh-stack layer index --
# both published by jm.portals-bootstrap on the server, styled here. $jm_ports
# (":5173 :3000", listening dev servers) leads the second row: the sidebar is
# narrow and a long branch name would push it off the end.
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$jm_mark", fg = "#89b4fa" }, "workspace"],
  [{ token = "$jm_ports", fg = "#f9e2af", bold = true }, "branch", "git_status", { token = "$jm_stack", fg = "#89b4fa" }],
]

# The host is a server too, for its Local workspaces: bring their claude
# sessions and scrollback back after a restart, as in the containers.
[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

[ui.toast]
delivery = "herdr"

[ui]
status_indicators = "dots"
sidebar_collapsed_mode = "hidden"
