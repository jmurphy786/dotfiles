# kitty for Omarchy: what wsl/wezterm/.wezterm.lua does, minus the WSL
# attachment. Both configs run the same scripts in ~/.config/herdr/scripts
# (the top-level `herdr` stow package); keep the key table below in step with
# the `machines` table in .wezterm.lua.

# Omarchy's theme, if present (globinclude: no error when it is missing).
globinclude ~/.config/omarchy/current/theme/kitty.conf

# ==========================================
# Appearance (as .wezterm.lua)
# ==========================================
font_family          JetBrainsMono Nerd Font
font_size            14.0
background_opacity   0.90
cursor_blink_interval 0
enable_audio_bell    no
confirm_os_window_close 0
window_padding_width 0
# WezTerm hides its tab bar; kitty's only shows once there is a second tab.
tab_bar_min_tabs     2

# ==========================================
# Remote control
# ==========================================
# herdr-tab.sh finds and opens tabs with `kitten @`. It is started by the
# keys below (no tty), so it reaches kitty through KITTY_LISTEN_ON.
allow_remote_control yes
listen_on            unix:@kitty-{kitty_pid}

# Open on the "all" tab running herdr (see herdr.session).
startup_session      herdr.session

# ==========================================
# Keys (as config.keys in .wezterm.lua)
# ==========================================
# herdr's next/previous workspace. kitty would scroll; send the key to herdr.
map ctrl+shift+j  send_key ctrl+shift+j
map ctrl+shift+k  send_key ctrl+shift+k

# One tab per herdr machine view, found by title and created on first use.
# These replace kitty's own ctrl+shift+r/n/1..4 (resize, new window, go to tab).
#   ctrl+shift+r      "all": the normal multi-machine herdr
#   ctrl+shift+1..3   one DevPod machine each
#   ctrl+shift+4      the host's own herdr, "linux" workspace
#   ctrl+shift+n      the same local tab, on its notes workspace
map ctrl+shift+r  launch --type=background sh -c '"$HOME/.config/herdr/scripts/herdr-tab.sh" all herdr'
map ctrl+shift+1  launch --type=background sh -c '"$HOME/.config/herdr/scripts/herdr-tab.sh" backend "herdr-notes.sh remote portalsv2-microservices.devpod"'
map ctrl+shift+2  launch --type=background sh -c '"$HOME/.config/herdr/scripts/herdr-tab.sh" mobile "herdr-notes.sh remote portalsv2-practitioner-mobile-app.devpod"'
map ctrl+shift+3  launch --type=background sh -c '"$HOME/.config/herdr/scripts/herdr-tab.sh" web "herdr-notes.sh remote portalsv2-frontend-web-apps.devpod"'
map ctrl+shift+4  launch --type=background sh -c '"$HOME/.config/herdr/scripts/herdr-tab.sh" -e "herdr-notes.sh ensure-local" local "herdr-notes.sh local"'
map ctrl+shift+n  launch --type=background sh -c '"$HOME/.config/herdr/scripts/herdr-tab.sh" -e "herdr-notes.sh ensure" local "herdr-notes.sh notes"'

# Font zoom, as WezTerm's ctrl+shift+up/down.
map ctrl+shift+up    change_font_size current +1.0
map ctrl+shift+down  change_font_size current -1.0
